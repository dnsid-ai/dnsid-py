[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnsid-google-kms"
version = "0.1.0"
description = "Optional Google Cloud KMS Ed25519 key provider for DNSid"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["dnsid>=0.32.1", "google-cloud-kms>=3.0", "google-crc32c>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["dnsid_google_kms"]
