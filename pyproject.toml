[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnsid"
version = "0.34.0"
description = "Python SDK for the DNSid Protocol — agent identity management and verification"
readme = "README.md"
authors = [{ name = "Known Systems AI, Inc." }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # IDNA A-label normalisation (normalize_fqdn)
    "idna>=3.6",
    # HTTP client for JWKS, status endpoint fetches, and DoH queries
    "httpx>=0.27",
    # System DNS resolver (TXT record lookup with DNSSEC awareness)
    "dnspython>=2.9.0",
    # Cryptographic operations (JWK thumbprint, ECDSA/EdDSA verify/sign)
    "cryptography>=42.0",
    # RFC 8941/9651 Structured Field parsing and serialization
    "http-sf>=1.3.0,<2",
]

[project.urls]
Documentation = "https://docs.dnsid.ai/"
Repository = "https://github.com/dnsid-ai/dnsid-py"
Issues = "https://github.com/dnsid-ai/dnsid-py/issues"
Changelog = "https://github.com/dnsid-ai/dnsid-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
gcp = [
    "google-cloud-kms>=3.0",
    "google-crc32c>=1.5",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "griffe>=1.5",
]
# Dependencies for the A2A example test only. Declared here (rather than
# installed ad hoc in CI) so they are captured in uv.lock and the test runs
# against a reproducible set. See #216.
a2a = [
    "fastapi",
    "uvicorn",
    "a2a-sdk>=1.2",
    "sse-starlette",
]

[tool.hatch.build.targets.wheel]
packages = ["dnsid"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402", "E501", "D"]
# Tests use literal credentials, invalid addresses/paths, and deterministic random data.
"tests/**/*.py" = ["E501", "D", "S101", "S104", "S105", "S106", "S108", "S311"]
# These calls run a fixed repository script with sys.executable, never shell input.
"tests/test_trust_policy_example.py" = ["S603"]
"scripts/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
