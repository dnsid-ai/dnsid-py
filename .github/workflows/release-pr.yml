name: Update Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-pr:
    if: "!startsWith(github.event.head_commit.message, 'chore: update changelog and version') && !startsWith(github.event.head_commit.message, 'Release v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: git-cliff

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compute next version and changelog
        id: prep
        run: |
          NEXT=$(git cliff --bumped-version | head -1)
          [ -n "$NEXT" ] || { echo "ERROR: git-cliff --bumped-version returned an empty version"; exit 1; }

          CURRENT="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$NEXT" = "$CURRENT" ] && git rev-parse "refs/tags/${CURRENT}" >/dev/null 2>&1; then
            echo "No releasable commits found (computed: ${NEXT}, current: ${CURRENT}). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            if [ "$NEXT" = "$CURRENT" ]; then
              python - "$CURRENT" <<'PY'
          import sys
          from pathlib import Path

          path = Path("CHANGELOG.md")
          changelog = path.read_text()
          marker = f"## [{sys.argv[1].removeprefix('v')}]"
          start = changelog.find(marker)
          if start != -1:
              next_start = changelog.find("\n## [", start + 1)
              path.write_text(changelog[:start] + changelog[next_start + 1 if next_start != -1 else len(changelog):])
          PY
            fi
            git cliff --unreleased --tag "$NEXT" --prepend CHANGELOG.md
            python - "$NEXT" <<'PY' > /tmp/release-notes.md
          import sys
          from pathlib import Path

          version = sys.argv[1].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          marker = f"## [{version}]"
          start = changelog.find(marker)
          if start == -1:
              raise SystemExit(f"ERROR: {marker} not found in CHANGELOG.md")

          next_start = changelog.find("\n## [", start + 1)
          section = changelog[start : next_start if next_start != -1 else len(changelog)]
          print(section.strip())
          PY
          fi

      - name: Bump pyproject.toml version
        if: steps.prep.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          VERSION_BARE="${VERSION#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION_BARE}\"/" pyproject.toml

      - name: Open or update release PR
        if: steps.prep.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: release/next
          title: "Release ${{ steps.prep.outputs.version }}"
          body-path: /tmp/release-notes.md
          commit-message: "chore: update changelog and version"
          labels: autorelease
