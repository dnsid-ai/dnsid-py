name: Auto-regenerate reference docs

# On every same-repo PR push, regenerate docs/reference/ and, when the output
# changed, push the fix to the PR branch — contributors never run the docs
# generator by hand. Fork PRs are skipped (GITHUB_TOKEN cannot push to forks);
# the freshness warning in lint-test.yml still tells fork authors the manual
# command.
#
# Loop guard: the job skips when the actor is github-actions[bot] (GraphQL-created
# commits do re-trigger pull_request), and a re-run would find no diff anyway. The same property means CI results shown on the PR
# belong to the contributor's last commit; the bot commit only touches
# docs/reference/, which no test job consumes.
on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: regen-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    # actor guard: createCommitOnBranch commits DO re-trigger pull_request, unlike GITHUB_TOKEN git pushes
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Regenerate reference
        run: python scripts/gen_docs.py

      # Commit through the GraphQL API instead of `git commit`: commits created
      # by createCommitOnBranch are signed by GitHub's web-flow key, so the bot
      # commit is Verified and satisfies signed-commit branch protection. A
      # GITHUB_TOKEN commit still does not re-trigger this workflow.
      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -A docs/reference/
          if git diff --cached --quiet; then
            echo "reference is current"
            exit 0
          fi
          git diff --cached --name-only --diff-filter=AM -z \
            | while IFS= read -r -d '' f; do base64 -w0 < "$f" > /tmp/b64; jq -n --arg p "$f" --rawfile c /tmp/b64 '{path: $p, contents: $c}'; done \
            | jq -s . > /tmp/additions.json
          git diff --cached --name-only --diff-filter=D -z \
            | jq -Rs 'split("\u0000") | map(select(length > 0) | {path: .})' > /tmp/deletions.json
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$(git rev-parse HEAD)" \
            --slurpfile additions /tmp/additions.json --slurpfile deletions /tmp/deletions.json '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "docs: regenerate reference" },
                fileChanges: { additions: $additions[0], deletions: $deletions[0] }
              } }
            }' > /tmp/commit.json
          gh api graphql --input /tmp/commit.json --jq '.data.createCommitOnBranch.commit.oid'
