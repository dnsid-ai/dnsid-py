name: Auto-regenerate reference docs

# Generate on same-repo PRs without write credentials. Only the separate commit
# job can write, and it accepts changes confined to docs/reference/*.md.
# Bot commits skip regeneration; expectedHeadOid rejects stale generated output.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: regen-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13 --extra dev

      - name: Regenerate reference
        run: uv run python scripts/gen_docs.py

      - name: Prepare documentation changes
        run: |
          git add -A docs/reference/
          git diff --cached --name-only --diff-filter=AM -z \
            | while IFS= read -r -d '' f; do base64 -w0 < "$f" > /tmp/b64; jq -n --arg p "$f" --rawfile c /tmp/b64 '{path: $p, contents: $c}'; done \
            | jq -s . > /tmp/additions.json
          git diff --cached --name-only --diff-filter=D -z \
            | jq -Rs 'split("\u0000") | map(select(length > 0) | {path: .})' > /tmp/deletions.json

      - name: Upload documentation changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-changes
          path: |
            /tmp/additions.json
            /tmp/deletions.json
          if-no-files-found: error

  commit:
    needs: regen
    runs-on: ubuntu-latest
    permissions:
      contents: write # Commit validated documentation changes through GraphQL.
    steps:
      # Never check out or execute PR code in this write-enabled job.
      - name: Download documentation changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference-changes
          path: ${{ runner.temp }}/docs-changes

      # GraphQL commits are signed and satisfy signed-commit branch protection.
      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGES_DIR: ${{ runner.temp }}/docs-changes
        run: |
          cd "$CHANGES_DIR"
          for file in additions.json deletions.json; do
            jq -e 'type == "array" and all(.[];
              (.path | startswith("docs/reference/") and endswith(".md")
                and (split("/") | all(. != "" and . != "." and . != ".."))))' "$file" > /dev/null
          done
          if [ "$(jq -s 'map(length) | add' additions.json deletions.json)" = 0 ]; then
            echo "reference is current"
            exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
            --slurpfile additions additions.json --slurpfile deletions deletions.json '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "docs: regenerate reference" },
                fileChanges: { additions: $additions[0], deletions: $deletions[0] }
              } }
            }' > commit.json
          gh api graphql --input commit.json --jq '.data.createCommitOnBranch.commit.oid'
